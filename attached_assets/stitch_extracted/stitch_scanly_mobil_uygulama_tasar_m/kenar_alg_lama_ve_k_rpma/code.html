<body class="bg-surface-container-lowest text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Task-Focused Top Bar -->
<header class="w-full flex justify-between items-center px-grid-margin py-stack-md bg-surface-container-lowest z-20">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined block text-[24px]">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Sınırları Ayarla</h1>
<button class="p-2 -mr-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined block text-[24px]">fullscreen</span>
</button>
</header>
<!-- Crop Canvas Area -->
<main class="flex-1 relative w-full bg-surface-container-high overflow-hidden flex items-center justify-center p-grid-margin">
<!-- Captured Image -->
<img alt="Document" class="max-w-full max-h-full object-contain shadow-lg" data-alt="A top-down, high-resolution view of a modern office desk featuring a crisp white surface. Placed squarely on the desk is a clearly printed Turkish business invoice document, exhibiting professional typography and faint organizational grid lines. The scene is illuminated by bright, even, and soft high-key lighting, perfectly simulating a pristine light-mode environment. The overall aesthetic is minimalist and highly professional, relying on stark whites, subtle grays, and the sharp, high-contrast black ink of the text to convey efficiency and clarity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAiUbVwwJxdILPC3LoCMwRaliHWYdNlccRYOBubqCKYQsP7EIqaKNUhPMjyx1pGu_mB4hZrVwKoGSKBPZOSuVVVskiblSXyPisaYZHGvxoToGqcl7wJ-l2-tRWXJhQyAzYB13WY7pLw7TXg3Wvo0Qf0QCTvrioJt-azM0OOp7b65H3x-8OqQzgZEtr6RYH0tGeo0lQCXUqGbBAPMKwMYiEt8d2LaBkXu2n_sUr2tEhBSVSlqcAeGRPXthzAHibn7xtdGn60dX-0jdFS"/>
<!-- Dark Overlay Mask (Simulated with semi-transparent background on container, punched out by crop box) -->
<div class="absolute inset-0 bg-[#000000]/40 pointer-events-none z-10"></div>
<!-- Interactive Crop Box -->
<div class="absolute top-[12%] left-[10%] right-[15%] bottom-[18%] border-2 border-primary z-20 shadow-[0_0_0_9999px_rgba(0,0,0,0.4)] sm:shadow-none box-content">
<!-- Grid Lines inside crop area -->
<div class="absolute inset-0 flex flex-col justify-evenly pointer-events-none opacity-30">
<div class="w-full h-[1px] bg-white"></div>
<div class="w-full h-[1px] bg-white"></div>
</div>
<div class="absolute inset-0 flex flex-row justify-evenly pointer-events-none opacity-30">
<div class="h-full w-[1px] bg-white"></div>
<div class="h-full w-[1px] bg-white"></div>
</div>
<!-- Corner Handles -->
<!-- Top Left -->
<div class="absolute -top-[14px] -left-[14px] w-7 h-7 bg-white border-[3px] border-primary rounded-full shadow-md cursor-nwse-resize flex items-center justify-center">
<div class="w-2 h-2 bg-primary rounded-full opacity-50"></div>
</div>
<!-- Top Right -->
<div class="absolute -top-[14px] -right-[14px] w-7 h-7 bg-white border-[3px] border-primary rounded-full shadow-md cursor-nesw-resize flex items-center justify-center">
<div class="w-2 h-2 bg-primary rounded-full opacity-50"></div>
</div>
<!-- Bottom Left -->
<div class="absolute -bottom-[14px] -left-[14px] w-7 h-7 bg-white border-[3px] border-primary rounded-full shadow-md cursor-nesw-resize flex items-center justify-center">
<div class="w-2 h-2 bg-primary rounded-full opacity-50"></div>
</div>
<!-- Bottom Right -->
<div class="absolute -bottom-[14px] -right-[14px] w-7 h-7 bg-white border-[3px] border-primary rounded-full shadow-md cursor-nwse-resize flex items-center justify-center">
<div class="w-2 h-2 bg-primary rounded-full opacity-50"></div>
</div>
<!-- Edge Handles (Midpoints) -->
<div class="absolute -top-[10px] left-1/2 -translate-x-1/2 w-8 h-[6px] bg-white border-[2px] border-primary rounded-full shadow-sm cursor-ns-resize"></div>
<div class="absolute -bottom-[10px] left-1/2 -translate-x-1/2 w-8 h-[6px] bg-white border-[2px] border-primary rounded-full shadow-sm cursor-ns-resize"></div>
<div class="absolute top-1/2 -left-[10px] -translate-y-1/2 h-8 w-[6px] bg-white border-[2px] border-primary rounded-full shadow-sm cursor-ew-resize"></div>
<div class="absolute top-1/2 -right-[10px] -translate-y-1/2 h-8 w-[6px] bg-white border-[2px] border-primary rounded-full shadow-sm cursor-ew-resize"></div>
</div>
</main>
<!-- Custom Bottom Action Bar (Task-Focused) -->
<footer class="w-full bg-surface-container-lowest rounded-t-[24px] shadow-[0_-8px_24px_0_rgba(87,94,112,0.08)] z-30 pt-stack-md pb-[max(32px,env(safe-area-inset-bottom))] px-grid-margin flex flex-col gap-stack-md relative">
<!-- Tool selection row -->
<div class="flex justify-center items-center gap-8">
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[24px]">rotate_left</span>
<span class="font-label-md text-label-md">Döndür</span>
</button>
<!-- Active Tool: Crop -->
<button class="flex flex-col items-center gap-1 text-primary">
<div class="bg-primary-container/20 p-2 rounded-full mb-1">
<span class="material-symbols-outlined text-[24px] text-primary" style="font-variation-settings: 'FILL' 1;">crop</span>
</div>
<span class="font-label-md text-label-md font-bold">Kırp</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[24px]">filter_b_and_w</span>
<span class="font-label-md text-label-md">Filtre</span>
</button>
</div>
<!-- Primary Actions Row -->
<div class="flex justify-between items-center w-full pt-stack-sm border-t border-surface-variant">
<button class="px-2 py-3 font-button-text text-button-text text-on-surface-variant hover:text-on-surface transition-colors">
                Yeniden Çek
            </button>
<button class="bg-primary text-on-primary font-button-text text-button-text px-8 py-3.5 rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-sm flex items-center gap-2">
                Devam Et
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
