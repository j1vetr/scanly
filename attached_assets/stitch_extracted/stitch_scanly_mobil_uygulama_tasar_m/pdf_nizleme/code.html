<div class="flex items-center gap-stack-md">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">PDF Önizleme</h1>

</button>

</div>

<div class="w-6 h-6 rounded-full bg-surface-container-lowest border-2 border-outline-variant flex items-center justify-center text-transparent hover:border-primary">
